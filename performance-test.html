<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Performance Analyzer</title>
  <style>
    body {
      margin: 0;
      font-family: 'Courier New', monospace;
      background: #1a1a1a;
      color: #0f0;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      color: #0ff;
      text-align: center;
      margin-bottom: 30px;
    }
    
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .metric-card {
      background: rgba(0, 255, 0, 0.1);
      border: 2px solid #0f0;
      border-radius: 8px;
      padding: 15px;
    }
    
    .metric-card.warning {
      border-color: #ff0;
      background: rgba(255, 255, 0, 0.1);
    }
    
    .metric-card.critical {
      border-color: #f00;
      background: rgba(255, 0, 0, 0.1);
    }
    
    .metric-title {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 5px;
    }
    
    .metric-value {
      font-size: 32px;
      font-weight: bold;
    }
    
    .metric-unit {
      font-size: 16px;
      opacity: 0.7;
    }
    
    .chart-container {
      background: rgba(0, 255, 0, 0.05);
      border: 2px solid #0f0;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
    }
    
    canvas {
      width: 100%;
      height: 200px;
    }
    
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    
    button {
      background: #0f0;
      color: #000;
      border: none;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
    }
    
    button:hover {
      background: #0ff;
    }
    
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    
    .log {
      background: rgba(0, 255, 0, 0.05);
      border: 2px solid #0f0;
      border-radius: 8px;
      padding: 15px;
      max-height: 300px;
      overflow-y: auto;
      font-size: 12px;
    }
    
    .log-entry {
      margin-bottom: 5px;
      padding: 5px;
      border-left: 3px solid #0f0;
      padding-left: 10px;
    }
    
    .log-entry.warning {
      border-left-color: #ff0;
      color: #ff0;
    }
    
    .log-entry.error {
      border-left-color: #f00;
      color: #f00;
    }
    
    .recommendations {
      background: rgba(0, 255, 255, 0.1);
      border: 2px solid #0ff;
      border-radius: 8px;
      padding: 20px;
      margin-top: 30px;
    }
    
    .recommendations h2 {
      color: #0ff;
      margin-top: 0;
    }
    
    .recommendation-item {
      margin: 15px 0;
      padding: 10px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
    }
    
    .priority-high { border-left: 4px solid #f00; }
    .priority-medium { border-left: 4px solid #ff0; }
    .priority-low { border-left: 4px solid #0f0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 3D Performance Analyzer</h1>
    
    <div class="controls">
      <button id="startTest">Start Performance Test</button>
      <button id="stopTest" disabled>Stop Test</button>
      <button id="exportReport">Export Report</button>
      <button id="clearLog">Clear Log</button>
    </div>
    
    <div class="metrics-grid">
      <div class="metric-card" id="fpsCard">
        <div class="metric-title">Current FPS</div>
        <div class="metric-value" id="currentFPS">--</div>
      </div>
      
      <div class="metric-card">
        <div class="metric-title">Avg FPS</div>
        <div class="metric-value" id="avgFPS">--</div>
      </div>
      
      <div class="metric-card">
        <div class="metric-title">Min FPS</div>
        <div class="metric-value" id="minFPS">--</div>
      </div>
      
      <div class="metric-card">
        <div class="metric-title">Draw Calls</div>
        <div class="metric-value" id="drawCalls">--</div>
      </div>
      
      <div class="metric-card">
        <div class="metric-title">Triangles</div>
        <div class="metric-value" id="triangles">--</div>
      </div>
      
      <div class="metric-card">
        <div class="metric-title">Memory</div>
        <div class="metric-value" id="memory">--</div>
        <span class="metric-unit">MB</span>
      </div>
      
      <div class="metric-card">
        <div class="metric-title">Frame Time</div>
        <div class="metric-value" id="frameTime">--</div>
        <span class="metric-unit">ms</span>
      </div>
      
      <div class="metric-card">
        <div class="metric-title">Test Duration</div>
        <div class="metric-value" id="duration">--</div>
        <span class="metric-unit">s</span>
      </div>
    </div>
    
    <div class="chart-container">
      <h3>FPS Over Time</h3>
      <canvas id="fpsChart"></canvas>
    </div>
    
    <div class="chart-container">
      <h3>Frame Time Distribution</h3>
      <canvas id="frameTimeChart"></canvas>
    </div>
    
    <div class="log" id="log">
      <div class="log-entry">Ready to start performance testing...</div>
    </div>
    
    <div class="recommendations" id="recommendations" style="display: none;">
      <h2>📊 Performance Recommendations</h2>
      <div id="recommendationsList"></div>
    </div>
  </div>
  
  <script>
    // Performance monitoring system
    class PerformanceMonitor {
      constructor() {
        this.isRunning = false;
        this.startTime = 0;
        this.frames = 0;
        this.fpsHistory = [];
        this.frameTimeHistory = [];
        this.minFPS = Infinity;
        this.maxFPS = 0;
        this.totalFPS = 0;
        this.lastFrameTime = performance.now();
        this.metrics = {
          drawCalls: 0,
          triangles: 0,
          memory: 0,
          visibleObjects: 0
        };
      }
      
      start() {
        this.isRunning = true;
        this.startTime = performance.now();
        this.frames = 0;
        this.fpsHistory = [];
        this.frameTimeHistory = [];
        this.minFPS = Infinity;
        this.maxFPS = 0;
        this.totalFPS = 0;
        this.log('Performance test started', 'info');
      }
      
      stop() {
        this.isRunning = false;
        this.log('Performance test stopped', 'info');
        this.generateReport();
      }
      
      update(fps, metrics = {}) {
        if (!this.isRunning) return;
        
        const now = performance.now();
        const frameTime = now - this.lastFrameTime;
        this.lastFrameTime = now;
        
        this.frames++;
        this.fpsHistory.push(fps);
        this.frameTimeHistory.push(frameTime);
        this.minFPS = Math.min(this.minFPS, fps);
        this.maxFPS = Math.max(this.maxFPS, fps);
        this.totalFPS += fps;
        
        // Update metrics
        Object.assign(this.metrics, metrics);
        
        // Keep history manageable
        if (this.fpsHistory.length > 300) {
          this.fpsHistory.shift();
          this.frameTimeHistory.shift();
        }
        
        this.updateUI();
      }
      
      updateUI() {
        const avgFPS = this.totalFPS / this.frames;
        const duration = (performance.now() - this.startTime) / 1000;
        
        // Update metrics
        document.getElementById('currentFPS').textContent = this.fpsHistory[this.fpsHistory.length - 1]?.toFixed(1) || '--';
        document.getElementById('avgFPS').textContent = avgFPS.toFixed(1);
        document.getElementById('minFPS').textContent = this.minFPS === Infinity ? '--' : this.minFPS.toFixed(1);
        document.getElementById('drawCalls').textContent = this.metrics.drawCalls || '--';
        document.getElementById('triangles').textContent = this.metrics.triangles?.toLocaleString() || '--';
        document.getElementById('memory').textContent = this.metrics.memory?.toFixed(1) || '--';
        document.getElementById('frameTime').textContent = this.frameTimeHistory[this.frameTimeHistory.length - 1]?.toFixed(2) || '--';
        document.getElementById('duration').textContent = duration.toFixed(1);
        
        // Update FPS card color
        const fpsCard = document.getElementById('fpsCard');
        const currentFPS = this.fpsHistory[this.fpsHistory.length - 1];
        fpsCard.className = 'metric-card';
        if (currentFPS < 30) fpsCard.classList.add('critical');
        else if (currentFPS < 45) fpsCard.classList.add('warning');
        
        // Update charts
        this.updateCharts();
      }
      
      updateCharts() {
        // FPS chart
        const fpsCanvas = document.getElementById('fpsChart');
        const fpsCtx = fpsCanvas.getContext('2d');
        fpsCanvas.width = fpsCanvas.offsetWidth;
        fpsCanvas.height = 200;
        
        fpsCtx.clearRect(0, 0, fpsCanvas.width, fpsCanvas.height);
        
        // Draw grid
        fpsCtx.strokeStyle = 'rgba(0, 255, 0, 0.1)';
        fpsCtx.lineWidth = 1;
        for (let i = 0; i <= 4; i++) {
          const y = (fpsCanvas.height / 4) * i;
          fpsCtx.beginPath();
          fpsCtx.moveTo(0, y);
          fpsCtx.lineTo(fpsCanvas.width, y);
          fpsCtx.stroke();
        }
        
        // Draw FPS line
        if (this.fpsHistory.length > 1) {
          fpsCtx.strokeStyle = '#0f0';
          fpsCtx.lineWidth = 2;
          fpsCtx.beginPath();
          
          const maxFPS = 60;
          const step = fpsCanvas.width / Math.max(this.fpsHistory.length - 1, 1);
          
          this.fpsHistory.forEach((fps, i) => {
            const x = i * step;
            const y = fpsCanvas.height - (fps / maxFPS) * fpsCanvas.height;
            if (i === 0) fpsCtx.moveTo(x, y);
            else fpsCtx.lineTo(x, y);
          });
          
          fpsCtx.stroke();
        }
        
        // Draw 60 FPS target line
        fpsCtx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
        fpsCtx.lineWidth = 1;
        fpsCtx.setLineDash([5, 5]);
        fpsCtx.beginPath();
        fpsCtx.moveTo(0, 0);
        fpsCtx.lineTo(fpsCanvas.width, 0);
        fpsCtx.stroke();
        fpsCtx.setLineDash([]);
        
        // Frame time histogram
        const ftCanvas = document.getElementById('frameTimeChart');
        const ftCtx = ftCanvas.getContext('2d');
        ftCanvas.width = ftCanvas.offsetWidth;
        ftCanvas.height = 200;
        
        ftCtx.clearRect(0, 0, ftCanvas.width, ftCanvas.height);
        
        if (this.frameTimeHistory.length > 0) {
          const bins = 50;
          const maxTime = Math.max(...this.frameTimeHistory);
          const binSize = maxTime / bins;
          const histogram = new Array(bins).fill(0);
          
          this.frameTimeHistory.forEach(time => {
            const bin = Math.min(Math.floor(time / binSize), bins - 1);
            histogram[bin]++;
          });
          
          const maxCount = Math.max(...histogram);
          const barWidth = ftCanvas.width / bins;
          
          histogram.forEach((count, i) => {
            const height = (count / maxCount) * ftCanvas.height;
            const x = i * barWidth;
            const y = ftCanvas.height - height;
            
            ftCtx.fillStyle = i < bins / 3 ? '#0f0' : i < bins * 2 / 3 ? '#ff0' : '#f00';
            ftCtx.fillRect(x, y, barWidth - 1, height);
          });
        }
      }
      
      log(message, type = 'info') {
        const logDiv = document.getElementById('log');
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        logDiv.appendChild(entry);
        logDiv.scrollTop = logDiv.scrollHeight;
      }
      
      generateReport() {
        const avgFPS = this.totalFPS / this.frames;
        const duration = (performance.now() - this.startTime) / 1000;
        
        this.log(`Test completed: ${this.frames} frames in ${duration.toFixed(1)}s`, 'info');
        this.log(`Average FPS: ${avgFPS.toFixed(1)}`, avgFPS < 45 ? 'warning' : 'info');
        this.log(`Min FPS: ${this.minFPS.toFixed(1)}`, this.minFPS < 30 ? 'error' : 'info');
        this.log(`Max FPS: ${this.maxFPS.toFixed(1)}`, 'info');
        
        // Generate recommendations
        this.generateRecommendations(avgFPS);
      }
      
      generateRecommendations(avgFPS) {
        const recommendations = [];
        
        if (avgFPS < 45) {
          recommendations.push({
            priority: 'high',
            title: 'Enable Frustum Culling',
            description: 'Remove mesh.frustumCulled = false to let Three.js automatically cull objects outside the camera view. Expected gain: +30-50% FPS.',
            code: '// Remove: mesh.frustumCulled = false;'
          });
          
          recommendations.push({
            priority: 'high',
            title: 'Throttle Raycasting',
            description: 'Perform raycasting every 3-5 frames instead of every frame. Expected gain: +10-20% FPS.',
            code: 'if (frameCount % 3 === 0) { /* raycast */ }'
          });
        }
        
        if (this.metrics.drawCalls > 100) {
          recommendations.push({
            priority: 'medium',
            title: 'Reduce Draw Calls',
            description: 'Consider merging geometries or using more aggressive LOD. Current: ' + this.metrics.drawCalls + ' draw calls.',
            code: 'Target: < 50 draw calls'
          });
        }
        
        if (avgFPS < 55) {
          recommendations.push({
            priority: 'medium',
            title: 'Make Bloom Optional',
            description: 'Disable UnrealBloomPass when FPS drops below 45. Expected gain: +15-25% FPS.',
            code: 'if (fps > 45) composer.render(); else renderer.render(scene, camera);'
          });
        }
        
        if (this.minFPS < 30) {
          recommendations.push({
            priority: 'high',
            title: 'Critical Performance Issue',
            description: 'FPS dropped below 30. Consider reducing render distance, sphere count, or LOD quality.',
            code: 'const RENDER_DIST = 8000; // Reduce from 12000'
          });
        }
        
        recommendations.push({
          priority: 'low',
          title: 'Add Performance Monitoring',
          description: 'Integrate Stats.js for real-time performance monitoring during development.',
          code: 'npm install stats.js'
        });
        
        this.displayRecommendations(recommendations);
      }
      
      displayRecommendations(recommendations) {
        const container = document.getElementById('recommendations');
        const list = document.getElementById('recommendationsList');
        list.innerHTML = '';
        
        recommendations.forEach(rec => {
          const item = document.createElement('div');
          item.className = `recommendation-item priority-${rec.priority}`;
          item.innerHTML = `
            <strong>${rec.title}</strong> [${rec.priority.toUpperCase()}]<br>
            ${rec.description}<br>
            <code style="display: block; margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.5); border-radius: 4px;">${rec.code}</code>
          `;
          list.appendChild(item);
        });
        
        container.style.display = 'block';
      }
      
      exportReport() {
        const avgFPS = this.totalFPS / this.frames;
        const duration = (performance.now() - this.startTime) / 1000;
        
        const report = {
          timestamp: new Date().toISOString(),
          duration: duration.toFixed(2),
          frames: this.frames,
          fps: {
            min: this.minFPS.toFixed(2),
            max: this.maxFPS.toFixed(2),
            avg: avgFPS.toFixed(2)
          },
          metrics: this.metrics,
          fpsHistory: this.fpsHistory,
          frameTimeHistory: this.frameTimeHistory
        };
        
        const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `performance-report-${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        
        this.log('Report exported', 'info');
      }
    }
    
    // Initialize monitor
    const monitor = new PerformanceMonitor();
    
    // UI Controls
    document.getElementById('startTest').addEventListener('click', () => {
      monitor.start();
      document.getElementById('startTest').disabled = true;
      document.getElementById('stopTest').disabled = false;
      
      // Simulate performance data (replace with actual Three.js metrics)
      const interval = setInterval(() => {
        if (!monitor.isRunning) {
          clearInterval(interval);
          return;
        }
        
        // Simulate FPS (replace with actual renderer.info data)
        const fps = 45 + Math.random() * 15;
        const metrics = {
          drawCalls: Math.floor(50 + Math.random() * 50),
          triangles: Math.floor(50000 + Math.random() * 100000),
          memory: performance.memory ? performance.memory.usedJSHeapSize / 1048576 : 0
        };
        
        monitor.update(fps, metrics);
      }, 16); // ~60fps
    });
    
    document.getElementById('stopTest').addEventListener('click', () => {
      monitor.stop();
      document.getElementById('startTest').disabled = false;
      document.getElementById('stopTest').disabled = true;
    });
    
    document.getElementById('exportReport').addEventListener('click', () => {
      monitor.exportReport();
    });
    
    document.getElementById('clearLog').addEventListener('click', () => {
      document.getElementById('log').innerHTML = '<div class="log-entry">Log cleared</div>';
    });
  </script>
</body>
</html>
